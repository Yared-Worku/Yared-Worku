name: Update Profile Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Repository Metrics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          # 1. Total Repositories owned by Yared-Worku (Public + Private)
          TOTAL_REPOS=$(gh repo list Yared-Worku --limit 1000 --json name --jq 'length')

          # 2. Private Repositories owned by Yared-Worku
          PRIVATE_REPOS=$(gh repo list Yared-Worku --visibility private --limit 1000 --json name --jq 'length')

          # 3. External Collaborations (Repos owned by OTHERS)
          COLLAB_REPOS=$(gh api user/repos?type=member --jq '[.[] | select(.owner.login != "Yared-Worku")] | length')

          echo "TOTAL_REPOS=$TOTAL_REPOS" >> $GITHUB_ENV
          echo "PRIVATE_REPOS=$PRIVATE_REPOS" >> $GITHUB_ENV
          echo "COLLAB_REPOS=$COLLAB_REPOS" >> $GITHUB_ENV

      - name: Update README Badges
        run: |
          # Update README.md with exact regex matching
          sed -i -E "s/(TOTAL%20REPOS-)[0-9]+/\1${TOTAL_REPOS}/g" README.md
          sed -i -E "s/(PRIVATE%20REPOS-)[0-9]+/\1${PRIVATE_REPOS}/g" README.md
          sed -i -E "s/(COLLABORATIONS-)[0-9]+/\1${COLLAB_REPOS}/g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: refresh repository badge metrics" && git push)

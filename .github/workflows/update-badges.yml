name: Update Profile Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch Repository Metrics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          # 1. Total Owned Repositories (Public + Private = 30)
          TOTAL_OWNED=$(gh api user --jq '.public_repos + .total_private_repos')

          # 2. Private Repositories (23)
          PRIVATE_REPOS=$(gh api user --jq '.total_private_repos')

          # 3. Collaborations (Repositories owned by OTHERS where you are a collaborator)
          COLLAB_REPOS=$(gh api user/repos?type=member --jq '[.[] | select(.owner.login != "Yared-Worku")] | length')

          echo "TOTAL_OWNED=$TOTAL_OWNED" >> $GITHUB_ENV
          echo "PRIVATE_REPOS=$PRIVATE_REPOS" >> $GITHUB_ENV
          echo "COLLAB_REPOS=$COLLAB_REPOS" >> $GITHUB_ENV

      - name: Update README Badges
        run: |
          sed -i -E "s/TOTAL%20REPOS-[0-9]+/TOTAL%20REPOS-${TOTAL_OWNED}/g" README.md
          sed -i -E "s/PRIVATE%20REPOS-[0-9]+/PRIVATE%20REPOS-${PRIVATE_REPOS}/g" README.md
          sed -i -E "s/COLLABORATIONS-[0-9]+/COLLABORATIONS-${COLLAB_REPOS}/g" README.md

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "update: refresh repository badge metrics" && git push)
